<!doctype html>
<!-- Covers: T-26. Throwaway mock of the phone Add entry sheet: amount first, account buttons that open a bottom sheet, category button that opens the same kind of sheet, collapsed More. Tap an account or category button, a sheet row or More to try it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-26 prototype: add entry</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f5;--surface:#fff;--raised:#f0eee6;--line:#e3e1d8;--fg:#1f1e1c;--muted:#6e6b63;--clay:#c96442}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1e;--surface:#262624;--raised:#30302e;--line:#3a3a37;--fg:#eceae3;--muted:#a3a19a}}
*{box-sizing:border-box}
body{margin:0;background:#cfc9bb;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--fg);display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.col h2{font:500 14px "Instrument Sans";margin:0;color:#444}
.phone{width:375px;height:760px;background:var(--bg);border-radius:36px;border:8px solid #111;position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.top b{font:500 18px "Source Serif 4",serif}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--raised);color:var(--fg);font-size:18px}
.body{flex:1;overflow-y:auto;padding:4px 16px 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--raised);border-radius:12px;padding:4px;margin-bottom:8px}
.seg button{height:40px;border:0;border-radius:9px;background:none;font:500 15px "Instrument Sans";color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px #0002}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:22px 0 18px}
.amount span{font:500 28px "Source Serif 4",serif;color:var(--muted)}
.amount input{width:200px;border:0;background:none;text-align:center;font:500 56px "Source Serif 4",serif;color:var(--fg);outline:none;font-variant-numeric:tabular-nums}
.amount input::placeholder{color:var(--line)}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 8px}
.acct{width:100%;min-height:64px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font:inherit;color:var(--fg);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.acct .t{display:flex;flex-direction:column;min-width:0}
.acct b{font-weight:600;font-size:15px}
.acct small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.acct i{font-style:normal;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 24px 1fr;align-items:stretch;gap:4px}
.pair .arrow{align-self:center;text-align:center;color:var(--muted)}
.pair .acct{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.pair .acct .cap{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:22px;background:var(--surface);font:inherit;font-size:15px;color:var(--fg)}
.chip[aria-pressed=true]{border-color:var(--clay);background:var(--clay);color:#fff}
.line{display:flex;gap:8px;margin-top:14px}
.line .f{flex:1;height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font:inherit;color:var(--fg);display:flex;align-items:center;gap:8px}
.line .f.date{font-weight:500}
.line input{border:0;background:none;outline:none;font:inherit;color:var(--fg);width:100%}
.more{margin-top:14px;width:100%;height:44px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
.extra{display:none;gap:8px;flex-direction:column}
.extra.on{display:flex}
.extra .f{height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;display:flex;align-items:center;color:var(--muted);font-size:15px}
.hint{font-size:12px;color:var(--muted);margin:2px 2px 0}
.err{color:var(--clay);font-size:13px;text-align:center;margin:-10px 2px 0}
.bad{border-color:var(--clay)!important}
.foot{padding:10px 16px 18px;border-top:1px solid var(--line);background:var(--bg)}
.save{width:100%;height:54px;border:0;border-radius:14px;background:var(--clay);color:#fff;font:600 17px "Instrument Sans"}
/* bottom sheet */
.scrim{position:absolute;inset:0;background:#0006;display:none;align-items:flex-end}
.scrim.on{display:flex}
.sheet{width:100%;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px 22px;max-height:75%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h3{font:500 18px "Source Serif 4",serif;margin:0 0 8px}
.row{width:100%;min-height:60px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--fg);text-align:left;display:flex;align-items:center;justify-content:space-between;padding:8px 4px}
.row b{font-weight:600;font-size:15px}
.row small{color:var(--muted);font-variant-numeric:tabular-nums}
.row .tick{color:var(--clay);font-weight:700;width:20px;text-align:right}
.note{max-width:375px;font-size:13px;color:#444}
</style>
</head>
<body>
<script>
const accounts=[["GCash","₱4,210.50"],["BDO Savings","₱18,900.00"],["Maya","₱620.00"],["Cash","₱1,150.00"],["BPI","₱7,305.25"]];
const cats={expense:["Food","Transport","Bills","Shopping","Health","Fun","Other"],income:["Salary","Side gig","Gift","Other"]};
const acctBtn=(slot,i)=>`<button class="acct" data-slot="${slot}" data-i="${i}"><span class="t"><b>${accounts[i][0]}</b><small>${accounts[i][1]}</small></span><i>▾</i></button>`;
const pairBtn=(slot,cap,i)=>i<0
 ?`<button class="acct" data-slot="${slot}" data-i="${i}"><span class="cap">${cap}</span><b>Pick…</b></button>`
 :`<button class="acct" data-slot="${slot}" data-i="${i}"><span class="cap">${cap}</span><b>${accounts[i][0]}</b><small>${accounts[i][1]}</small></button>`;
const catBtn=(type,i)=>`<button class="acct" data-slot="cat" data-i="${i}"><span class="t"><b>${i<0?"Pick a category":cats[type][i]}</b></span><i>▾</i></button>`;
function phone(title,type,{amount="",from=0,to=1,cat=0,more=false,error=false,sheet=false}={}){
 const t=type==="transfer";
 return `<div class="col"><h2>${title}</h2><div class="phone" data-type="${type}">
 <div class="top"><b>Add entry</b><button class="x" aria-label="Close">✕</button></div>
 <div class="body">
  <div class="seg">${["expense","income","transfer"].map(k=>`<button aria-pressed="${k===type}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
  <div class="amount"><span>₱</span><input inputmode="decimal" placeholder="0.00" value="${amount}" class="${error?"bad":""}"></div>
  ${error?`<p class="err">Enter an amount above zero.</p>`:""}
  ${t?`<div class="lbl">Move money</div><div class="pair">${pairBtn("from","From",from)}<span class="arrow">→</span>${pairBtn("to","To",to)}</div>`
     :`<div class="lbl">Account</div>${acctBtn("from",from)}<div class="lbl">Category</div>${catBtn(type,cat)}`}
  <div class="line"><div class="f date">📅 Today</div></div><div class="line" style="margin-top:8px"><div class="f"><input placeholder="Add a note"></div></div>
  <button class="more" onclick="this.nextElementSibling.classList.toggle('on')"><span>More: ${t?"For (set aside)":"Payee"}</span><span>▾</span></button>
  <div class="extra ${more?"on":""}">${t?`<div class="f">For: None</div><p class="hint">Counts toward its Set aside bar. Nothing is paid.</p>`:`<div class="f">${type==="income"?"Payee (Employer)":"Payee (Jollibee)"}</div>`}</div>
 </div>
 <div class="foot"><button class="save">Add entry</button></div>
 <div class="scrim ${sheet?"on":""}"><div class="sheet"></div></div>
 </div></div>`}
function openSheet(p,slot,i,withOther){
 const s=p.querySelector(".scrim"),sh=s.querySelector(".sheet");
 if(slot==="cat"){sh.innerHTML=`<div class="grab"></div><h3>Category</h3>`+cats[p.dataset.type].map((c,k)=>`<button class="row" data-pick="${k}"><b>${c}</b><span class="tick">${k===i?"✓":""}</span></button>`).join("");sh.dataset.slot=slot;s.classList.add("on");return}
 sh.innerHTML=`<div class="grab"></div><h3>${slot==="to"?"To":t(p)?"From":"Account"}</h3>`+
  accounts.map((a,k)=>`<button class="row" data-pick="${k}"><span><b>${a[0]}</b><br><small>${a[1]}</small></span><span class="tick">${k===i?"✓":""}</span></button>`).join("")+
  (slot==="to"?`<button class="row" data-pick="other"><span><b>Someone else…</b><br><small>Not one of your accounts</small></span><span class="tick"></span></button>`:"");
 sh.dataset.slot=slot;s.classList.add("on");
}
const t=p=>p.querySelector(".pair");
document.body.insertAdjacentHTML("beforeend",
 phone("Expense","expense",{amount:"250"})+
 phone("Income (no category yet)","income",{from:1,cat:-1})+
 phone("Transfer","transfer",{amount:"1,000",from:1,to:0,more:true})+
 phone("Expense with error","expense",{error:true,from:2,cat:1}));
document.body.insertAdjacentHTML("beforeend",phone("Account sheet open (tap the dimmed area to close)","expense",{amount:"250"}));
openSheet(document.body.lastElementChild.querySelector(".phone"),"from",0);
document.body.insertAdjacentHTML("beforeend",`<p class="note">Account buttons open a bottom sheet of big rows with balances; the chosen one is ticked. In a real entry the account defaults to the last one used, so most entries skip this step. Transfer shows From and To side by side; "Someone else…" appears only in To. Category uses the same sheet (chips would be one tap faster with about 8 or fewer; a search box helps past that). Type tabs are static here.</p>`);
document.addEventListener("click",e=>{
 const p=e.target.closest(".phone");if(!p)return;
 const btn=e.target.closest(".acct");
 if(btn){openSheet(p,btn.dataset.slot,+btn.dataset.i);return}
 const pick=e.target.closest("[data-pick]");
 if(pick){
  const slot=pick.closest(".sheet").dataset.slot,target=p.querySelector(`.acct[data-slot=${slot}]`),k=pick.dataset.pick;
  if(slot==="cat"){target.dataset.i=k;target.innerHTML=`<span class="t"><b>${cats[p.dataset.type][+k]}</b></span><i>▾</i>`}
  else if(k==="other"){target.innerHTML=`<span class="cap">To</span><b>Someone else</b><small>Name: Mom</small>`;target.dataset.i=-1}
  else{const a=accounts[+k];target.dataset.i=k;target.innerHTML=t(p)?`<span class="cap">${slot==="to"?"To":"From"}</span><b>${a[0]}</b><small>${a[1]}</small>`:`<span class="t"><b>${a[0]}</b><small>${a[1]}</small></span><i>▾</i>`}
  p.querySelector(".scrim").classList.remove("on");return}
 if(e.target.classList.contains("scrim"))e.target.classList.remove("on");
});
</script>
</body>
</html>
