<!doctype html>
<!-- Covers: T-27. Throwaway mock of an Insights page: month picker, income/spent/left, a written summary built from the numbers (no AI), where the money went as bars, and a 6-month trend. Numbers only, no "saved". Transfers between own accounts are left out. Tap the arrows to change month. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototype: insights</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f5;--surface:#fff;--raised:#f0eee6;--line:#e3e1d8;--fg:#1f1e1c;--muted:#6e6b63;--clay:#c96442;--green:#0f7a47}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1e;--surface:#262624;--raised:#30302e;--line:#3a3a37;--fg:#eceae3;--muted:#a3a19a;--green:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;background:#cfc9bb;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--fg);display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.col h2{font:500 14px "Instrument Sans";margin:0;color:#444}
.note{max-width:375px;font-size:13px;color:#444;margin:0}
.phone{width:375px;height:760px;background:var(--bg);border-radius:36px;border:8px solid #111;overflow:hidden;display:flex;flex-direction:column}
.desk{width:860px;height:640px;background:var(--bg);border-radius:12px;border:6px solid #111;overflow:hidden;display:flex}
.side{width:150px;border-right:1px solid var(--line);background:var(--surface);padding:16px 12px;font-size:14px;color:var(--muted);display:grid;gap:12px;align-content:start}
.side .on{color:var(--fg);font-weight:600}
.body{flex:1;overflow-y:auto;padding:20px 16px 12px}
.desk .body{padding:28px 36px}
h1{font:500 28px "Source Serif 4",serif;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
.month{display:flex;align-items:center;gap:4px;margin-bottom:14px}
.month button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:18px}
.month b{flex:1;text-align:center;font:500 18px "Source Serif 4",serif}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.nums div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.nums small{display:block;color:var(--muted);font-size:12px}
.nums b{font:500 18px "Source Serif 4",serif;font-variant-numeric:tabular-nums}
.say{background:var(--raised);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h3{font:600 14px "Instrument Sans";margin:0 0 10px}
.cat{margin-bottom:12px}
.cat .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.cat .t b{font-variant-numeric:tabular-nums;font-weight:600}
.bar{height:10px;border-radius:5px;background:var(--raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--clay)}
.cat small{color:var(--muted);font-size:12px}
.up{color:var(--clay)}.down{color:var(--green)}
.trend{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:4px}
.trend .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.trend .pair{display:flex;align-items:flex-end;gap:3px;height:100%}
.trend .pair i{width:11px;border-radius:3px 3px 0 0}
.trend .m.cur span{font-weight:600;color:var(--fg)}
.trend span{font-size:11px;color:var(--muted)}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.foot{font-size:12px;color:var(--muted);margin:2px 0 8px}
.nav{height:64px;border-top:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:repeat(5,1fr);font-size:11px;color:var(--muted);text-align:center;align-items:center}
.nav .on{color:var(--fg);font-weight:600}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
</style>
</head>
<body>
<script>
const php=n=>"₱"+n.toLocaleString("en-US",{maximumFractionDigits:0});
// months oldest to newest; the last is November
const names=["Jun","Jul","Aug","Sep","Oct","Nov"];
const data=[
 {inc:28000,cats:[["Food",7200],["Rent",8000],["Transport",2400],["Bills",3100],["Shopping",1800]]},
 {inc:28000,cats:[["Food",7600],["Rent",8000],["Transport",2300],["Bills",3100],["Shopping",2600]]},
 {inc:30500,cats:[["Food",6900],["Rent",8000],["Transport",2500],["Bills",3200],["Shopping",900]]},
 {inc:28000,cats:[["Food",8100],["Rent",8000],["Transport",2200],["Bills",3100],["Shopping",3400]]},
 {inc:28000,cats:[["Food",6800],["Rent",8000],["Transport",2600],["Bills",3100],["Shopping",1500]]},
 {inc:28000,cats:[["Food",7600],["Rent",8000],["Transport",2900],["Bills",3100],["Shopping",2200],["Health",1100]]}];
const spent=m=>m.cats.reduce((s,c)=>s+c[1],0);
let cur=5;
const view=layout=>{
 const m=data[cur],p=data[cur-1],sp=spent(m),psp=p?spent(p):0,left=m.inc-sp;
 const cats=[...m.cats].sort((a,b)=>b[1]-a[1]);
 const delta=c=>{const old=p?.cats.find(x=>x[0]===c[0]);if(!old)return `<small>new this month</small>`;const d=Math.round((c[1]-old[1])/old[1]*100);return `<small class="${d>0?"up":"down"}">${d>0?"↑":"↓"} ${Math.abs(d)}% vs ${names[cur-1]}</small>`};
 const top=cats[0],say=`You spent <b>${php(sp)}</b> in ${names[cur]}${p?`, ${sp>psp?"up":"down"} ${Math.abs(Math.round((sp-psp)/psp*100))}% from ${names[cur-1]}`:""}. <b>${Math.round(top[1]/sp*100)}%</b> went to ${top[0]}. You have <b>${php(left)}</b> left of ${php(m.inc)} income.`;
 const max=Math.max(...data.map(x=>Math.max(x.inc,spent(x))));
 const top3=`<div class="nums"><div><small>Income</small><b>${php(m.inc)}</b></div><div><small>Spent</small><b>${php(sp)}</b></div><div><small>Left</small><b>${php(left)}</b></div></div>`;
 const where=`<div class="card"><h3>Where it went</h3>${cats.map(c=>`<div class="cat"><div class="t"><span>${c[0]}</span><b>${php(c[1])} · ${Math.round(c[1]/sp*100)}%</b></div><div class="bar"><i style="width:${c[1]/cats[0][1]*100}%"></i></div>${delta(c)}</div>`).join("")}</div>`;
 const trend=`<div class="card"><h3>Last 6 months</h3><div class="trend">${data.map((x,i)=>`<div class="m ${i===cur?"cur":""}"><div class="pair"><i style="height:${x.inc/max*90}px;background:var(--green)"></i><i style="height:${spent(x)/max*90}px;background:var(--clay)"></i></div><span>${names[i]}</span></div>`).join("")}</div><div class="key"><span><i style="background:var(--green)"></i>Income</span><span><i style="background:var(--clay)"></i>Spent</span></div></div>`;
 const head=`<h1>Insights</h1><p class="sub">Where your money goes.</p><div class="month"><button onclick="step(-1)" aria-label="Previous month">‹</button><b>${["June","July","August","September","October","November"][cur]} 2026</b><button onclick="step(1)" aria-label="Next month">›</button></div>`;
 const foot=`<p class="foot">Moves between your own accounts are left out.</p>`;
 return layout==="phone"?head+top3+`<div class="say">${say}</div>`+where+trend+foot:head+top3+`<div class="say">${say}</div><div class="cols">${where}${trend}</div>`+foot};
const nav=`<div class="nav"><span>Overview</span><span>Accounts</span><span>Activity</span><span>Bills</span><span class="on">More</span></div>`;
function render(){document.body.innerHTML=
 `<div class="col"><h2>Phone (reached from More)</h2><div class="phone"><div class="body">${view("phone")}</div>${nav}</div><p class="note">Same cards as the rest of the app. The bars reuse the progress-bar look, so no chart library; the 6-month trend is the only real chart (hand-drawn, a few divs).</p></div>
 <div class="col"><h2>Desktop (sidebar item "Insights")</h2><div class="desk"><div class="side"><span>Overview</span><span>Accounts</span><span>Activity</span><span>Bills</span><span>Budget</span><span class="on">Insights</span></div><div class="body">${view("desk")}</div></div><p class="note" style="max-width:860px">The written line is a template filled with the numbers (no AI), so it is always correct. "Spent" counts expenses only; "Left" is income minus spent.</p></div>`}
function step(d){cur=Math.min(5,Math.max(0,cur+d));render()}
render();
</script>
</body>
</html>
