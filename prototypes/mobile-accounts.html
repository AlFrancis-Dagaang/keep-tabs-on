<!doctype html>
<!-- Covers: T-26. Throwaway mock of the phone Accounts page as a stack of cards: tinted by the account's tile color, big balance, a ⋯ menu for Edit and Remove, Net worth card on top. Tap ⋯ to open the menu. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-26 prototype: accounts</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f5;--surface:#fff;--raised:#f0eee6;--line:#e3e1d8;--fg:#1f1e1c;--muted:#6e6b63;--clay:#c96442}
@media (prefers-color-scheme:dark){:root{--bg:#1f1f1e;--surface:#262624;--raised:#30302e;--line:#3a3a37;--fg:#eceae3;--muted:#a3a19a}}
*{box-sizing:border-box}
body{margin:0;background:#cfc9bb;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--fg);display:flex;gap:32px;justify-content:center;align-items:flex-start;padding:24px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.col h2{font:500 14px "Instrument Sans";margin:0;color:#444}
.phone{width:375px;height:760px;background:var(--bg);border-radius:36px;border:8px solid #111;position:relative;overflow:hidden;display:flex;flex-direction:column}
.body{flex:1;overflow-y:auto;padding:20px 16px 12px}
.head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
h1{font:500 28px "Source Serif 4",serif;margin:0}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.add{height:40px;padding:0 14px;border:0;border-radius:10px;background:var(--clay);color:#fff;font:600 14px "Instrument Sans"}
.net{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.net small{color:var(--muted);font-size:13px}
.net b{display:block;font:500 34px "Source Serif 4",serif;font-variant-numeric:tabular-nums;margin-top:2px}
.net .ex{font-size:12px;color:var(--muted);margin-top:2px}
.card{position:relative;border-radius:18px;padding:14px 16px;margin-bottom:10px;color:#fff;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 3px #0003}
.card .r{display:flex;align-items:center;justify-content:space-between}
.card .n{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.card .ic{width:34px;height:34px;border-radius:10px;background:#fff3;display:grid;place-items:center;font-weight:700}
.card .bal{font:500 28px "Source Serif 4",serif;font-variant-numeric:tabular-nums}
.card .tag{font-size:12px;opacity:.85}
.card.off{filter:saturate(.35);opacity:.9}
.dots{width:44px;height:44px;margin:-8px -10px 0 0;border:0;background:none;color:#fff;font-size:22px;line-height:1;border-radius:50%}
.menu{position:absolute;right:12px;top:52px;z-index:2;min-width:150px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px #0004;padding:4px;display:none}
.menu.on{display:block}
.menu button{width:100%;height:46px;border:0;background:none;font:inherit;font-size:15px;color:var(--fg);text-align:left;padding:0 12px;border-radius:8px}
.menu button.del{color:var(--clay)}
.menu button:active{background:var(--raised)}
.nav{height:64px;border-top:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:repeat(5,1fr);font-size:11px;color:var(--muted);text-align:center;align-items:center}
.nav .on{color:var(--fg);font-weight:600}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--muted)}
.note{max-width:375px;font-size:13px;color:#444}
</style>
</head>
<body>
<script>
const money=n=>"₱"+n.toLocaleString("en-US",{minimumFractionDigits:2});
const colors={clay:"#C96442",blue:"#1A5FD0",green:"#0F7A47",purple:"#6A4FC2",grey:"#6E6B63"};
const accts=[["GCash","blue",4210.5,1],["BDO Savings","green",18900,1],["Maya","purple",620,1],["Cash","clay",1150,1],["Old BPI","grey",7305.25,0]];
const card=(a,i,open)=>`<div class="card ${a[3]?"":"off"}" style="background:${colors[a[1]]}">
 <div class="r"><span class="n"><span class="ic">${a[0][0]}</span>${a[0]}</span><button class="dots" aria-label="Actions for ${a[0]}">⋯</button></div>
 <div><div class="bal">${money(a[2])}</div>${a[3]?"":`<div class="tag">Not in net worth</div>`}</div>
 <div class="menu ${open?"on":""}"><button>Edit</button><button class="del">Remove</button></div></div>`;
function phone(title,{list=accts,open=-1}={}){
 const inNet=list.filter(a=>a[3]),total=inNet.reduce((s,a)=>s+a[2],0),ex=list.length-inNet.length;
 return `<div class="col"><h2>${title}</h2><div class="phone"><div class="body">
 <div class="head"><div><h1>Accounts</h1><p class="sub">Every place your money sits.</p></div><button class="add">+ Add</button></div>
 ${list.length?`<div class="net"><small>Net worth</small><b>${money(total)}</b>${ex?`<div class="ex">Excludes ${ex} account${ex>1?"s":""}</div>`:""}</div>${list.map((a,i)=>card(a,i,i===open)).join("")}`
  :`<p class="empty">No accounts yet. Add your first account, like your bank, GCash or cash on hand.</p>`}
 </div><div class="nav"><span>Overview</span><span class="on">Accounts</span><span>Activity</span><span>Bills</span><span>More</span></div></div></div>`}
document.body.insertAdjacentHTML("beforeend",phone("Accounts")+phone("⋯ menu open",{open:1})+phone("No accounts yet",{list:[]}));
document.body.insertAdjacentHTML("beforeend",`<p class="note">Each account is a full-width card tinted with its tile color (a bank logo, when one is added, replaces the letter). Tap a card to open its detail page; ⋯ opens Edit and Remove, and Remove still asks to confirm. An account left out of net worth is muted and says so. Net worth sits on top. Tap ⋯ to try the menu.</p>`);
document.addEventListener("click",e=>{
 const d=e.target.closest(".dots"),was=d&&d.parentElement.parentElement.querySelector(".menu").classList.contains("on");
 document.querySelectorAll(".menu.on").forEach(m=>m.classList.remove("on"));
 if(d&&!was)d.parentElement.parentElement.querySelector(".menu").classList.add("on");
});
</script>
</body>
</html>
